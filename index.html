<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>G3 Online Receipt</title>

<style>

body{

    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;

}

.app-header{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    background:white;

    padding:15px;

    box-shadow:0 2px 5px rgba(0,0,0,.15);

}

.logo{

    width:50px;

}

.app-title{

    font-size:28px;
    font-weight:bold;
    color:#123A78;

}

.main-container{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:30px;

    margin-top:30px;

}

.receipt-area{

    background:white;

    padding:20px;

    border:1px solid #ccc;

}

#receipt{

    width:900px;

}

.control-panel{

    width:120px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.control-panel button{

    padding:10px;

    font-size:16px;

    cursor:pointer;

}

#studentName{

    position:absolute;

    left:328px;
    top:197px;

    width:260px;

        font-size:14px;
        font-weight:normal;

        white-space:nowrap;

}

#receiptDate{

    position:absolute;

    left:585px;
    top:205px;

    width:180px;

    font-size:10px;
    font-weight:normal;

    white-space:nowrap;

}

</style>

</head>
<body>

<header class="app-header">
    <img src="トータルロゴ.png" class="logo">
    <span class="app-title">煌 日本語オンライン G3 Online Receipt</span>
</header>

<div class="main-container">

    <div class="receipt-area" style="position:relative;">

        <img id="receipt" src="receipt10.png" alt="Receipt">
        
        <div id="studentName"></div>

        <div id="receiptDate"></div>

            <div id="mousePos">X:0　Y:0</div>

        </div>

    <div class="control-panel">

        <button onclick="changeReceipt(10)">10回</button>

        <button onclick="changeReceipt(20)">20回</button>

        <button onclick="changeReceipt(30)">30回</button>

        <hr>

        <button>PNG保存</button>

    </div>

</div>

<script>

const receiptData = {

    name : "山田 太郎",

    date : "15/07/2026"

};

const receiptPos = {

    10:{
        name:{
            left:328,
            top:197,
            size:14
        },
        date:{
            left:585,
            top:205,
            size:10
        }
    },

    20:{
        name:{
            left:280,
            top:290,
            size:18
        },
        date:{
            left:675,
            top:300,
            size:12
        }
    },

    30:{
        name:{
            left:290,
            top:255,
            size:14
        },
        date:{
            left:615,
            top:260,
            size:10
        }
    }

};

function changeReceipt(course){

    const img=document.getElementById("receipt");

    const studentName = document.getElementById("studentName");
    const receiptDate = document.getElementById("receiptDate");

    studentName.textContent = receiptData.name;
    receiptDate.textContent = receiptData.date;

    if(course===10){
        img.src="receipt10.png";
    }

    if(course===20){
        img.src="receipt20.png";
    }

    if(course===30){
        img.src="receipt30.png";
    }

    studentName.style.left = receiptPos[course].name.left + "px";
    studentName.style.top  = receiptPos[course].name.top + "px";

    receiptDate.style.left = receiptPos[course].date.left + "px";
    receiptDate.style.top  = receiptPos[course].date.top + "px"; 

    studentName.style.fontSize =
        receiptPos[course].name.size + "px";

    receiptDate.style.fontSize =
        receiptPos[course].date.size + "px";

}

const receipt = document.getElementById("receipt");
const mousePos = document.getElementById("mousePos");

receipt.addEventListener("click", function(e){

    mousePos.textContent =
        "X:" + Math.round(e.offsetX) +
        "  Y:" + Math.round(e.offsetY);

});

</script>

</body>
</html>
