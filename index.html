<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>G3 Online Receipt</title>

<style>

body{

    margin:0;
    background:#f5f5f5;
    font-family:Arial,sans-serif;

}

.app-header{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    background:white;

    padding:15px;

    box-shadow:0 2px 5px rgba(0,0,0,.15);

}

.logo{

    width:50px;

}

.app-title{

    font-size:28px;
    font-weight:bold;
    color:#123A78;

}

.main-container{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:30px;

    margin-top:30px;

}

.receipt-area{

    background:white;

    padding:20px;

    border:1px solid #ccc;

}

#receipt{

    width:900px;

}

.control-panel{

    width:120px;

    display:flex;

    flex-direction:column;

    gap:10px;

}

.control-panel button{

    padding:10px;

    font-size:16px;

    cursor:pointer;

}

#studentName{

    position:absolute;

    left:328px;
    top:197px;

    width:260px;

        font-size:14px;
        font-weight:normal;

        white-space:nowrap;

}

#receiptDate{

    position:absolute;

    left:585px;
    top:205px;

    width:180px;

    font-size:10px;
    font-weight:normal;

    white-space:nowrap;

}

#stamp{

    position:absolute;

    left:350px;
    top:350px;

    width:120px;

}

.stamp-date{

    position:absolute;

    text-align:center;

    font-weight:bold;

    pointer-events:none;

}

</style>

</head>
<body>

<header class="app-header">
    <img src="トータルロゴ.png" class="logo">
    <span class="app-title">煌 日本語オンライン G3 Online Receipt</span>
</header>

<div class="main-container">

    <div class="receipt-area" style="position:relative;">

        <img id="receipt" src="receipt10/receipt10_0.png" alt="Receipt">

        <div id="studentName"></div>

        <div id="receiptDate"></div>

        <div id="mousePos">X:0　Y:0</div>

        </div>

    <div class="control-panel">

        <button onclick="changeReceipt(10)">10回</button>

        <button onclick="changeReceipt(20)">20回</button>

        <button onclick="changeReceipt(30)">30回</button>

        <hr>

        <button>PNG保存</button>

    </div>

</div>

<script>

const receiptData = {

    name : "山田 太郎",

    date : "15/07/2026",

    count : 1

};

// ===== 開発用ダミー日付 =====
const testDates = [

    "26/08/01","26/08/02","26/08/03","26/08/04","26/08/05",
    "26/08/06","26/08/07","26/08/08","26/08/09","26/08/10",

    "26/08/11","26/08/12","26/08/13","26/08/14","26/08/15",
    "26/08/16","26/08/17","26/08/18","26/08/19","26/08/20",

    "26/08/21","26/08/22","26/08/23","26/08/24","26/08/25",
    "26/08/26","26/08/27","26/08/28","26/08/29","26/08/30"

];

async function loadReceiptData(){

    console.log("loadReceiptData 開始");

    // URLからID取得
    const id = new URLSearchParams(window.location.search).get("id");

    if(!id){
        alert("IDがありません。");
        return;
    }

    const response = await fetch(
        "https://script.google.com/macros/s/AKfycbynod0rBS95yXLkUIYFOeZiTFHTUd6UJu578YxSESQgIFsA2EPpe7bE0GXNVbLe0Sx4Dg/exec?mode=receipt&id=" + encodeURIComponent(id)
    );

    const data = await response.json();

    console.log(data);

    receiptData.name = data.name;
    receiptData.date = data.date;
    receiptData.count = data.count;

    changeReceipt(data.course);

}

const receiptPos = {

    10:{
        name:{
            left:328,
            top:197,
            size:14
        },
        date:{
            left:585,
            top:205,
            size:10
        }
    },

    20:{
        name:{
            left:280,
            top:290,
            size:18
        },
        date:{
            left:675,
            top:300,
            size:12
        }
    },

    30:{
        name:{
            left:290,
            top:255,
            size:14
        },
        date:{
            left:615,
            top:260,
            size:10
        }
    }

};

const datePos = {

    10: [
        { x:296, y:480 }, //1
        { x:372, y:480 }, //2
        { x:446, y:480 }, //3
        { x:521, y:480 }, //4

        { x:296, y:575 }, //6

        { x:446, y:575 }, //8
        { x:521, y:575 }, //9
        { x:595, y:575 }  //10
    ],   // ← このカンマを追加


    20: [
        { x:250, y:720 }, //1
        { x:364, y:720 }, //2
        { x:477, y:720 }, //3
        { x:592, y:720 }, //4
        { x:710, y:720 }, //5

        { x:250, y:865 }, //6
        { x:364, y:865 }, //7
        { x:477, y:865 }, //8
        { x:592, y:865 }, //9
        { x:710, y:865 }, //10

        { x:250, y:1010 }, //11

        { x:592, y:1010 }, //14
        { x:710, y:1010 }, //15

        { x:250, y:1151 }, //16
        { x:364, y:1151 }, //17
        { x:477, y:1151 }, //18
        { x:592, y:1151 }, //19
        { x:710, y:1151 }  //20
    ],

    20: [

        { x:263, y:583 }, //1
        { x:358, y:586 }, //2
        { x:451, y:586 }, //3
        { x:544, y:585 }, //4
        { x:637, y:585 }, //5

        { x:265, y:703 }, //6

        { x:546, y:703 }, //9
        { x:639, y:703 }, //10

        { x:265, y:818 }, //11

        { x:453, y:818 }, //13

        { x:639, y:818 }, //15

        { x:265, y:933 }, //16
        { x:360, y:933 }, //17
        { x:453, y:933 }, //18

        { x:639, y:933 }, //20

        { x:264, y:1048 }, //21

        { x:264, y:1162 }, //26

        { x:452, y:1164 }, //28
        { x:545, y:1164 }, //29
        { x:639, y:1165 }  //30
    ]

};

// ===== スタンプ日付表示設定 =====
const stampDateStyle = {

    10:{
        width:50,
        size:7,
        color:"#cc0000"
    },

    20:{
        width:42,
        size:10,
        color:"#cc0000"
    },

    30:{
        width:36,
        size:6,
        color:"#cc0000"
    }

};

function changeReceipt(course){

    const img = document.getElementById("receipt");

    const studentName = document.getElementById("studentName");
    const receiptDate = document.getElementById("receiptDate");

    studentName.textContent = receiptData.name;
    receiptDate.textContent = receiptData.date;

    // ===== 10回コース =====
    if(course === 10){

        let count = receiptData.count;

        if(count < 1) count = 1;
        if(count > 10) count = 10;

        img.src = "receipt10/receipt10_" + count + ".png";

    }

    // ===== 20回コース =====
    if(course === 20){

        let count = receiptData.count;

        if(count < 1) count = 1;
        if(count > 20) count = 20;

        img.src = "receipt20/receipt20_" + count + ".png";

    }

    // ===== 30回コース =====
    if(course === 30){

        let count = receiptData.count;

        if(count < 1) count = 1;
        if(count > 30) count = 30;

        img.src = "receipt30/receipt30_" + count + ".png";

    }

    // ===== 文字位置 =====
    studentName.style.left = receiptPos[course].name.left + "px";
    studentName.style.top  = receiptPos[course].name.top + "px";

    receiptDate.style.left = receiptPos[course].date.left + "px";
    receiptDate.style.top  = receiptPos[course].date.top + "px";

    // ===== 文字サイズ =====
    studentName.style.fontSize =
        receiptPos[course].name.size + "px";

    receiptDate.style.fontSize =
        receiptPos[course].date.size + "px";

}
const receipt = document.getElementById("receipt");
const mousePos = document.getElementById("mousePos");

receipt.addEventListener("click", function(e){

    mousePos.textContent =
        "X:" + Math.round(e.offsetX) +
        "  Y:" + Math.round(e.offsetY);

});

// ===== 開発用 日付表示 =====
function showTestDates(){

    // 古い日付を削除
    document.querySelectorAll(".stamp-date").forEach(el => el.remove());

    const area = document.querySelector(".receipt-area");

    for(let i=0;i<30;i++){

        const div = document.createElement("div");

        div.className = "stamp-date";

        div.textContent = testDates[i];

        div.style.left = datePos[30][i].x + "px";
        div.style.top  = datePos[30][i].y + "px";

        div.style.width = stampDateStyle[30].width + "px";
        div.style.fontSize = stampDateStyle[30].size + "px";
        div.style.color = stampDateStyle[30].color;

        area.appendChild(div);

    }

}

showTestDates();

loadReceiptData();

</script>

</body>
</html>
